<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Name Picker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shader-bg" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <canvas class="confetti-canvas" id="confettiCanvas" aria-hidden="true"></canvas>
    <div class="winner-toast" id="winnerToast" role="status" aria-live="polite"></div>
    <svg class="glass-filter" aria-hidden="true">
      <defs>
        <filter
          id="container-glass"
          x="0%"
          y="0%"
          width="100%"
          height="100%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.05 0.05"
            numOctaves="1"
            seed="1"
            result="turbulence"
          />
          <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise" />
          <feDisplacementMap
            in="SourceGraphic"
            in2="blurredNoise"
            scale="46"
            xChannelSelector="R"
            yChannelSelector="B"
            result="displaced"
          />
          <feGaussianBlur in="displaced" stdDeviation="3" result="finalBlur" />
          <feComposite in="finalBlur" in2="finalBlur" operator="over" />
        </filter>
      </defs>
    </svg>

    <header class="app-nav">
      <div class="brand-row">
        <div class="logo-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p>Classroom picker</p>
      </div>

      <div class="side-toolbar" aria-label="View and class tools">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme">
          <span class="theme-icon" aria-hidden="true"></span>
          <span id="themeLabel">Light</span>
        </button>
        <button class="tool-button" id="openClassesButton" type="button" aria-controls="classDrawer" aria-expanded="false">
          Classes
        </button>
        <button class="tool-button" id="presenterButton" type="button">
          Expand
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="intro-panel" aria-label="Student list controls">
        <form class="entry-form" id="entryForm">
          <label for="nameInput">Add students</label>
          <div class="input-row">
            <textarea
              id="nameInput"
              name="name"
              rows="2"
              placeholder="Maya, Leo, Aisha..."
            ></textarea>
            <button class="button primary" type="submit">+ Add</button>
          </div>
          <p class="hint">Paste names separated by commas or new lines.</p>
        </form>

        <div class="actions" aria-label="List controls">
          <button class="button glass" id="shuffleButton" type="button">Shuffle</button>
          <button class="button glass" id="sortButton" type="button">Sort A-Z</button>
          <button class="button glass" id="sampleButton" type="button">Sample class</button>
          <button class="button quiet" id="clearButton" type="button">Clear</button>
        </div>

        <label class="draw-option" for="removeWinnerToggle">
          <input id="removeWinnerToggle" type="checkbox">
          <span>
            <strong>Remove picked names</strong>
            <small>Use this for turn-taking without repeats.</small>
          </span>
        </label>

        <section class="names-panel" aria-labelledby="namesTitle">
          <div class="panel-heading">
            <h2 id="namesTitle">Student roster</h2>
            <span id="nameCount">0</span>
          </div>
          <ul class="name-list" id="nameList"></ul>
          <p class="empty-state" id="emptyState">Add at least two students to start.</p>
        </section>
      </section>

      <section class="wheel-panel" aria-labelledby="wheelTitle">
        <div class="wheel-topline">
          <div>
            <p class="eyebrow">Classroom draw</p>
            <h2 id="wheelTitle">Tap the center to pick</h2>
          </div>
          <div class="seed-chip" id="seedChip" aria-live="polite">Ready</div>
        </div>

        <div class="wheel-stage">
          <div class="pointer" aria-hidden="true"></div>
          <div class="wheel-wrap">
            <canvas id="wheelCanvas" width="760" height="760" aria-label="Name drawing wheel"></canvas>
            <button class="wheel-hub" id="spinButton" type="button" aria-label="Spin the wheel">
              <span>SPIN</span>
            </button>
          </div>
        </div>

        <div class="winner-strip" id="winnerStrip" aria-live="polite">
          <span class="winner-label">Selected student</span>
          <span class="result-pencil" aria-hidden="true">
            <span class="pencil-tip"></span>
            <span class="pencil-body"></span>
            <span class="pencil-eraser"></span>
          </span>
          <strong id="winnerName">No winner yet</strong>
          <span class="winner-doodles" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>

      </section>
    </main>

    <aside class="class-drawer" id="classDrawer" aria-hidden="true">
      <section class="class-panel" aria-labelledby="classesTitle">
        <div class="class-heading">
          <div>
            <h2 id="classesTitle">Saved classes</h2>
            <p id="classStatus" aria-live="polite">Save this roster for next time.</p>
          </div>
          <button class="drawer-close" id="closeClassesButton" type="button" aria-label="Close saved classes">×</button>
        </div>
        <form class="class-form" id="classSaveForm">
          <label for="classNameInput">Class name</label>
          <div class="class-save-row">
            <input
              class="class-name-input"
              id="classNameInput"
              name="className"
              type="text"
              autocomplete="off"
              placeholder="Period 3 Science"
            >
            <button class="button primary" id="saveClassButton" type="submit">Save</button>
          </div>
        </form>
        <div class="class-load-row">
          <label for="classSelect">Load roster</label>
          <div class="class-select-actions">
            <select class="class-select" id="classSelect"></select>
            <button class="button glass" id="loadClassButton" type="button">Load</button>
            <button class="button quiet" id="deleteClassButton" type="button">Delete</button>
          </div>
        </div>
      </section>
    </aside>

    <script src="app.js"></script>
  </body>
</html>
